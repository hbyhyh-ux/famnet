<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>팜넷(협) 발주</title>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue: #1a6ef5;
    --red: #ff4136;
    --bg: #f4f6f9;
    --line: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: #222;
    padding-bottom: 100px;
  }
  header {
    background: #fff;
    padding: 16px 20px;
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .section {
    background: #fff;
    margin: 12px 12px 0;
    padding: 16px;
    border-radius: 10px;
  }
  .section h2 {
    font-size: 14px;
    color: #888;
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin: 10px 0 4px;
  }
  input[type=text], input[type=tel], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: #fafcff;
  }
  textarea { resize: vertical; min-height: 50px; }
  .item-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .item-row {
    display: flex;
    gap: 8px;
  }
  .item-row > div { flex: 1; }
  .qty-input { max-width: 130px; flex: none !important; }
  .qty-stepper {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #fafcff;
  }
  .qty-stepper .item-qty {
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-radius: 0;
    width: 44px;
    text-align: center;
    padding: 11px 4px;
    background: #fff;
  }
  .qty-btn {
    width: 38px;
    flex: none;
    border: none;
    background: #fafcff;
    color: var(--blue);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .qty-btn:active { background: #eef4ff; }
  .remove-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: #bbb;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
  }
  .add-btn {
    width: 100%;
    padding: 12px;
    border: 1px dashed var(--blue);
    background: #eef4ff;
    color: var(--blue);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .submit-btn:disabled { background: #ccc; }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }
  #status.error { color: var(--red); }
  #status.ok { color: #1aa15e; }
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.85);
    z-index: 100;
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-weight: 700;
  }
  .overlay.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #eee;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>팜넷(협) 발주 입력</header>

<div class="section">
  <h2>주문자 정보</h2>
  <label>주문자 성명</label>
  <input type="text" id="orderer" placeholder="선택 입력 사항입니다.">
</div>

<div class="section">
  <h2>받는 분 (배송지)</h2>
  <label>받는분 성명 *</label>
  <input type="text" id="recipientName">
  <label>연락처 *</label>
  <input type="tel" id="recipientPhone" placeholder="010-0000-0000">
  <label>배송지 주소 *</label>
  <div style="display:flex; gap:8px;">
    <input type="text" id="addressBase" placeholder="주소 검색을 눌러주세요" readonly style="background:#f0f2f5;">
    <button type="button" id="addressSearchBtn" onclick="searchAddress()" style="flex:none; padding:0 16px; border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:6px; font-weight:700; font-size:14px;">검색</button>
  </div>
  <input type="text" id="addressDetail" placeholder="상세주소를 입력해주세요(동/호수 등)" style="margin-top:8px;">
  <label>배송메모</label>
  <input type="text" id="deliveryMemo" placeholder="예: 부재시 경비실에 부탁드립니다.">
</div>

<div class="section">
  <h2>주문 상품</h2>
  <div id="items"></div>
  <button type="button" class="add-btn" onclick="addItem()">+ 상품 추가</button>
</div>

<div class="submit-bar">
  <button class="submit-btn" id="submitBtn" onclick="submitOrder()">발주서(엑셀파일) 생성</button>
  <div id="status"></div>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div>발주서(엑셀파일) 생성 중...</div>
</div>

<template id="itemTemplate">
  <div class="item-card">
    <button type="button" class="remove-btn" onclick="removeItem(this)">&times;</button>
    <label>제품명 *</label>
    <input type="text" class="item-name" placeholder="상품명을 입력하세요">
    <div class="item-row" style="margin-top:10px;">
      <div>
        <label>출고구분 *</label>
        <select class="item-category">
          <option value="냉동">냉동</option>
          <option value="냉장">냉장</option>
          <option value="상온">상온</option>
        </select>
      </div>
      <div class="qty-input">
        <label>수량 *</label>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" onclick="changeQty(this, -1)">&minus;</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="item-qty" value="1" oninput="sanitizeQty(this)" onblur="sanitizeQty(this, true)">
          <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  function addItem() {
    var tpl = document.getElementById('itemTemplate');
    var clone = tpl.content.cloneNode(true);
    document.getElementById('items').appendChild(clone);
  }
  function removeItem(btn) {
    var cards = document.querySelectorAll('.item-card');
    if (cards.length <= 1) return; // 최소 1개는 유지
    btn.closest('.item-card').remove();
  }
  addItem(); // 첫 상품 카드 1개 기본 생성

  function changeQty(btn, delta) {
    var input = btn.parentElement.querySelector('.item-qty');
    var next = (parseInt(input.value, 10) || 1) + delta;
    if (next < 1) next = 1;
    input.value = next;
  }

  function sanitizeQty(input, onBlur) {
    var digits = input.value.replace(/[^0-9]/g, '');
    if (onBlur && (digits === '' || parseInt(digits, 10) < 1)) digits = '1';
    input.value = digits;
  }

  var zipcode = ''; // 검색으로 선택된 우편번호 (화면엔 안 보이지만 발주 데이터에는 포함됨)

  function searchAddress() {
    new daum.Postcode({
      oncomplete: function (data) {
        var base = data.roadAddress || data.jibunAddress;
        document.getElementById('addressBase').value = base;
        zipcode = data.zonecode;
        document.getElementById('addressDetail').focus();
      },
    }).open();
  }

  var HEADERS = ['발주처', '출고구분', '제품명', '수량', '받는분 성명', '우편번호', '배송지', '연락처', '배송메모', '비고', '택배사', '운송장번호', '주문자 성명'];

  // 브라우저 안에서 바로 이지어드민 발주 양식(xlsx)을 만들어 다운로드한다. (서버 없음)
  function buildAndDownloadXlsx(order) {
    var rows = order.items.map(function (item) {
      return [
        '', // 발주처 (비워둠 - 업로드 시 판매처는 이지어드민 쪽에서 지정됨)
        item.category,
        item.name,
        item.qty,
        order.recipient.name,
        order.recipient.zipcode,
        order.recipient.address,
        order.recipient.phone,
        order.deliveryMemo || '',
        '', // 비고
        '', // 택배사 - 이지어드민에서 채워짐
        '', // 운송장번호 - 이지어드민에서 채워짐
        order.orderer,
      ];
    });

    var sheetData = [HEADERS].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(sheetData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

    var today = new Date();
    var dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    var label = order.recipient.name || order.orderer || '발주';
    XLSX.writeFile(wb, '발주_' + label + '_' + dateStr + '.xlsx');
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function submitOrder() {
    var orderer = document.getElementById('orderer').value.trim();
    var recipientName = document.getElementById('recipientName').value.trim();
    var recipientPhone = document.getElementById('recipientPhone').value.trim();
    var addressBase = document.getElementById('addressBase').value.trim();
    var addressDetail = document.getElementById('addressDetail').value.trim();
    var address = addressDetail ? (addressBase + ' ' + addressDetail) : addressBase;
    var deliveryMemo = document.getElementById('deliveryMemo').value.trim();

    var items = [];
    document.querySelectorAll('.item-card').forEach(function (card) {
      var name = card.querySelector('.item-name').value.trim();
      var category = card.querySelector('.item-category').value;
      var qty = parseInt(card.querySelector('.item-qty').value, 10);
      items.push({ name: name, category: category, qty: qty });
    });

    if (!recipientName) return setStatus('받는분 성명을 입력해주세요', 'error');
    if (!recipientPhone) return setStatus('연락처를 입력해주세요', 'error');
    if (!address) return setStatus('배송지를 입력해주세요', 'error');
    if (items.length === 0) return setStatus('상품을 1개 이상 입력해주세요', 'error');
    for (var i = 0; i < items.length; i++) {
      if (!items[i].name) return setStatus((i + 1) + '번째 제품명을 입력해주세요', 'error');
      if (!items[i].qty || items[i].qty < 1) return setStatus((i + 1) + '번째 수량을 확인해주세요', 'error');
    }

    var order = {
      orderer: orderer,
      recipient: { name: recipientName, phone: recipientPhone, zipcode: zipcode, address: address },
      deliveryMemo: deliveryMemo,
      items: items,
    };

    document.getElementById('overlay').classList.add('show');
    document.getElementById('submitBtn').disabled = true;
    setStatus('');

    try {
      buildAndDownloadXlsx(order);
      setStatus('발주 파일이 다운로드되었습니다. (' + order.items.length + '개 품목) 이지어드민에 업로드해주세요.', 'ok');
      document.getElementById('items').innerHTML = '';
      addItem();
      document.getElementById('orderer').value = '';
      document.getElementById('recipientName').value = '';
      document.getElementById('recipientPhone').value = '';
      document.getElementById('addressBase').value = '';
      document.getElementById('addressDetail').value = '';
      document.getElementById('deliveryMemo').value = '';
      zipcode = '';
    } catch (err) {
      setStatus(err.message || '오류가 발생했습니다. 다시 시도해주세요.', 'error');
    } finally {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('submitBtn').disabled = false;
    }
  }
</script>

</body>
</html>
