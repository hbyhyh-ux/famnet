<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>팜넷(협) 발주</title>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue: #1a6ef5;
    --red: #ff4136;
    --bg: #f4f6f9;
    --line: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: #222;
    padding-bottom: 100px;
  }
  header {
    background: #fff;
    padding: 16px 20px;
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .section {
    background: #fff;
    margin: 12px 12px 0;
    padding: 16px;
    border-radius: 10px;
  }
  .section h2 {
    font-size: 14px;
    color: #888;
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin: 10px 0 4px;
  }
  input[type=text], input[type=tel], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: #fafcff;
  }
  textarea { resize: vertical; min-height: 50px; }

  .order-card {
    border: 2px solid var(--blue);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    background: #f8faff;
    position: relative;
  }
  .order-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .order-card-title {
    font-weight: 800;
    font-size: 14px;
    color: var(--blue);
  }
  .remove-order-btn {
    border: none;
    background: none;
    color: #999;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px 6px;
  }
  .order-items-label {
    font-size: 13px;
    color: #888;
    margin: 16px 0 8px;
    font-weight: 700;
  }
  .order-card.collapsed {
    background: #fff;
    border-color: #cfe0ff;
  }
  .complete-btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: #1aa15e;
    color: #fff;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }
  .order-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 0 2px;
  }
  .summary-text {
    font-size: 14px;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .summary-text::before {
    content: "✓ ";
    color: #1aa15e;
    font-weight: 800;
  }
  .edit-order-btn {
    flex: none;
    border: 1px solid var(--blue);
    background: #fff;
    color: var(--blue);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .item-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
    background: #fff;
  }
  .item-row {
    display: flex;
    gap: 8px;
  }
  .item-row > div { flex: 1; }
  .qty-input { max-width: 130px; flex: none !important; }
  .qty-stepper {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #fafcff;
  }
  .qty-stepper .item-qty {
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-radius: 0;
    width: 44px;
    text-align: center;
    padding: 11px 4px;
    background: #fff;
  }
  .qty-btn {
    width: 38px;
    flex: none;
    border: none;
    background: #fafcff;
    color: var(--blue);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .qty-btn:active { background: #eef4ff; }
  .remove-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: #bbb;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
  }
  .add-btn {
    width: 100%;
    padding: 12px;
    border: 1px dashed var(--blue);
    background: #eef4ff;
    color: var(--blue);
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-order-btn {
    width: 100%;
    padding: 14px;
    border: 2px dashed var(--blue);
    background: #fff;
    color: var(--blue);
    border-radius: 10px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
  .address-search-row {
    display: flex;
    gap: 8px;
  }
  .address-search-btn {
    flex: none;
    padding: 0 16px;
    border: 1px solid var(--blue);
    background: #fff;
    color: var(--blue);
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
  }
  .submit-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }
  .submit-btn:disabled { background: #ccc; }
  #status {
    text-align: center;
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }
  #status.error { color: var(--red); }
  #status.ok { color: #1aa15e; }
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.85);
    z-index: 100;
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-weight: 700;
  }
  .overlay.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #eee;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>팜넷(협) 발주 입력</header>

<div class="section">
  <h2>주문자 정보</h2>
  <label>주문자 성명</label>
  <input type="text" id="orderer" placeholder="선택 입력 사항입니다.">
</div>

<div class="section">
  <h2>배송지 (한 번에 여러 곳으로 보낼 수 있어요)</h2>
  <div id="orders"></div>
  <button type="button" class="add-order-btn" onclick="addOrder()">+ 배송지 추가</button>
</div>

<div class="submit-bar">
  <button class="submit-btn" id="submitBtn" onclick="submitOrder()">발주서(엑셀파일) 생성</button>
  <div id="status"></div>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <div>발주서(엑셀파일) 생성 중...</div>
</div>

<template id="orderTemplate">
  <div class="order-card">
    <div class="order-card-header">
      <span class="order-card-title">배송지</span>
      <button type="button" class="remove-order-btn" data-action="remove-order">배송지 삭제</button>
    </div>

    <div class="order-detail">
      <label>받는분 성명 *</label>
      <input type="text" class="recipientName">
      <label>연락처 *</label>
      <input type="tel" class="recipientPhone" placeholder="010-0000-0000">
      <label>배송지 주소 *</label>
      <div class="address-search-row">
        <input type="text" class="addressBase" placeholder="주소 검색을 눌러주세요" readonly style="background:#f0f2f5;">
        <button type="button" class="address-search-btn" data-action="search-address">검색</button>
      </div>
      <input type="text" class="addressDetail" placeholder="상세주소를 입력해주세요(동/호수 등)" style="margin-top:8px;">
      <label>배송메모</label>
      <input type="text" class="deliveryMemo" placeholder="예: 부재시 경비실에 부탁드립니다.">

      <div class="order-items-label">주문 상품</div>
      <div class="items"></div>
      <button type="button" class="add-btn" data-action="add-item">+ 상품 추가</button>

      <button type="button" class="complete-btn" data-action="complete-order">입력 완료</button>
    </div>

    <div class="order-summary" style="display:none;">
      <div class="summary-text"></div>
      <button type="button" class="edit-order-btn" data-action="edit-order">수정</button>
    </div>
  </div>
</template>

<template id="itemTemplate">
  <div class="item-card">
    <button type="button" class="remove-btn" data-action="remove-item">&times;</button>
    <label>제품명 *</label>
    <input type="text" class="item-name" placeholder="상품명을 입력하세요">
    <div class="item-row" style="margin-top:10px;">
      <div>
        <label>출고구분 *</label>
        <select class="item-category">
          <option value="냉동">냉동</option>
          <option value="냉장">냉장</option>
          <option value="상온">상온</option>
        </select>
      </div>
      <div class="qty-input">
        <label>수량 *</label>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" data-action="qty-minus">&minus;</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="item-qty" value="1">
          <button type="button" class="qty-btn" data-action="qty-plus">+</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  var orderCount = 0;

  function addOrder() {
    orderCount++;
    var tpl = document.getElementById('orderTemplate');
    var clone = tpl.content.cloneNode(true);
    var card = clone.querySelector('.order-card');
    card.querySelector('.order-card-title').textContent = '배송지 #' + orderCount;
    document.getElementById('orders').appendChild(clone);
    addItem(card); // 상품 1개 기본 생성
    renumberOrders();
  }

  function removeOrder(btn) {
    var cards = document.querySelectorAll('.order-card');
    if (cards.length <= 1) return; // 최소 1개는 유지
    btn.closest('.order-card').remove();
    renumberOrders();
  }

  function renumberOrders() {
    document.querySelectorAll('.order-card').forEach(function (card, i) {
      card.querySelector('.order-card-title').textContent = '배송지 #' + (i + 1);
    });
  }

  function addItem(orderCard) {
    var tpl = document.getElementById('itemTemplate');
    var clone = tpl.content.cloneNode(true);
    orderCard.querySelector('.items').appendChild(clone);
  }

  function removeItem(btn) {
    var orderCard = btn.closest('.order-card');
    var cards = orderCard.querySelectorAll('.item-card');
    if (cards.length <= 1) return; // 배송지당 최소 1개는 유지
    btn.closest('.item-card').remove();
  }

  function changeQty(btn, delta) {
    var input = btn.parentElement.querySelector('.item-qty');
    var next = (parseInt(input.value, 10) || 1) + delta;
    if (next < 1) next = 1;
    input.value = next;
  }

  function sanitizeQty(input, onBlur) {
    var digits = input.value.replace(/[^0-9]/g, '');
    if (onBlur && (digits === '' || parseInt(digits, 10) < 1)) digits = '1';
    input.value = digits;
  }

  function searchAddress(orderCard) {
    new daum.Postcode({
      oncomplete: function (data) {
        var base = data.roadAddress || data.jibunAddress;
        orderCard.querySelector('.addressBase').value = base;
        orderCard.dataset.zipcode = data.zonecode;
        orderCard.querySelector('.addressDetail').focus();
      },
    }).open();
  }

  // 배송지 카드 하나를 읽어서 검증한다. 문제 있으면 {error}, 없으면 {delivery}를 반환.
  function readOrderCard(card, tag) {
    var recipientName = card.querySelector('.recipientName').value.trim();
    var recipientPhone = card.querySelector('.recipientPhone').value.trim();
    var addressBase = card.querySelector('.addressBase').value.trim();
    var addressDetail = card.querySelector('.addressDetail').value.trim();
    var address = addressDetail ? (addressBase + ' ' + addressDetail) : addressBase;
    var deliveryMemo = card.querySelector('.deliveryMemo').value.trim();
    var zipcode = card.dataset.zipcode || '';

    if (!recipientName) return { error: tag + '받는분 성명을 입력해주세요' };
    if (!recipientPhone) return { error: tag + '연락처를 입력해주세요' };
    if (!address) return { error: tag + '배송지를 입력해주세요' };

    var items = [];
    card.querySelectorAll('.item-card').forEach(function (itemCard) {
      var name = itemCard.querySelector('.item-name').value.trim();
      var category = itemCard.querySelector('.item-category').value;
      var qty = parseInt(itemCard.querySelector('.item-qty').value, 10);
      items.push({ name: name, category: category, qty: qty });
    });

    if (items.length === 0) return { error: tag + '상품을 1개 이상 입력해주세요' };
    for (var i = 0; i < items.length; i++) {
      if (!items[i].name) return { error: tag + (i + 1) + '번째 제품명을 입력해주세요' };
      if (!items[i].qty || items[i].qty < 1) return { error: tag + (i + 1) + '번째 수량을 확인해주세요' };
    }

    return {
      delivery: {
        recipient: { name: recipientName, phone: recipientPhone, zipcode: zipcode, address: address },
        deliveryMemo: deliveryMemo,
        items: items,
      },
    };
  }

  function completeOrder(btn) {
    var card = btn.closest('.order-card');
    var result = readOrderCard(card, '');
    if (result.error) {
      setStatus(result.error, 'error');
      return;
    }
    setStatus('');
    var d = result.delivery;
    card.querySelector('.summary-text').textContent = d.recipient.name + ' · ' + d.recipient.phone + ' · 상품 ' + d.items.length + '개';
    card.classList.add('collapsed');
    card.querySelector('.order-detail').style.display = 'none';
    card.querySelector('.order-summary').style.display = 'flex';
  }

  function editOrder(btn) {
    var card = btn.closest('.order-card');
    card.classList.remove('collapsed');
    card.querySelector('.order-detail').style.display = '';
    card.querySelector('.order-summary').style.display = 'none';
  }

  // 배송지 카드 / 상품 카드 안의 버튼 클릭을 한 곳에서 처리 (이벤트 위임)
  document.getElementById('orders').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'remove-order') removeOrder(btn);
    else if (action === 'add-item') addItem(btn.closest('.order-card'));
    else if (action === 'remove-item') removeItem(btn);
    else if (action === 'search-address') searchAddress(btn.closest('.order-card'));
    else if (action === 'qty-minus') changeQty(btn, -1);
    else if (action === 'qty-plus') changeQty(btn, 1);
    else if (action === 'complete-order') completeOrder(btn);
    else if (action === 'edit-order') editOrder(btn);
  });
  document.getElementById('orders').addEventListener('input', function (e) {
    if (e.target.classList.contains('item-qty')) sanitizeQty(e.target);
  });
  document.getElementById('orders').addEventListener(
    'blur',
    function (e) {
      if (e.target.classList.contains('item-qty')) sanitizeQty(e.target, true);
    },
    true
  );

  addOrder(); // 첫 배송지 카드 1개 기본 생성

  var HEADERS = ['발주처', '출고구분', '제품명', '수량', '받는분 성명', '우편번호', '배송지', '연락처', '배송메모', '비고', '택배사', '운송장번호', '주문자 성명'];

  // 브라우저 안에서 바로 이지어드민 발주 양식(xlsx)을 만들어 다운로드한다. (서버 없음)
  function buildAndDownloadXlsx(orderer, deliveries) {
    var rows = [];
    deliveries.forEach(function (d) {
      d.items.forEach(function (item) {
        rows.push([
          '', // 발주처 (비워둠 - 업로드 시 판매처는 이지어드민 쪽에서 지정됨)
          item.category,
          item.name,
          item.qty,
          d.recipient.name,
          d.recipient.zipcode,
          d.recipient.address,
          d.recipient.phone,
          d.deliveryMemo || '',
          '', // 비고
          '', // 택배사 - 이지어드민에서 채워짐
          '', // 운송장번호 - 이지어드민에서 채워짐
          orderer,
        ]);
      });
    });

    var sheetData = [HEADERS].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(sheetData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

    var today = new Date();
    var dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    var label = deliveries.length > 1 ? (deliveries[0].recipient.name + ' 외 ' + (deliveries.length - 1) + '건') : (deliveries[0].recipient.name || orderer || '발주');
    var fileName = '발주_' + label + '_' + dateStr + '.xlsx';

    XLSX.writeFile(wb, fileName);
    return rows.length;
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function submitOrder() {
    var orderer = document.getElementById('orderer').value.trim();
    var orderCards = Array.from(document.querySelectorAll('.order-card'));
    var deliveries = [];

    for (var oi = 0; oi < orderCards.length; oi++) {
      var tag = orderCards.length > 1 ? ('배송지 #' + (oi + 1) + ' - ') : '';
      var result = readOrderCard(orderCards[oi], tag);
      if (result.error) return setStatus(result.error, 'error');
      deliveries.push(result.delivery);
    }

    document.getElementById('overlay').classList.add('show');
    document.getElementById('submitBtn').disabled = true;
    setStatus('');

    try {
      var rowCount = buildAndDownloadXlsx(orderer, deliveries);
      setStatus('발주 파일이 다운로드되었습니다. (배송지 ' + deliveries.length + '곳, 총 ' + rowCount + '개 품목) 이지어드민에 업로드해주세요.', 'ok');

      document.getElementById('orders').innerHTML = '';
      orderCount = 0;
      addOrder();
      document.getElementById('orderer').value = '';
    } catch (err) {
      setStatus(err.message || '오류가 발생했습니다. 다시 시도해주세요.', 'error');
    } finally {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('submitBtn').disabled = false;
    }
  }
</script>

</body>
</html>
